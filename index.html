<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202938">
  <title>TURBOMINDS — AI-Powered Knowledge Handover Platform</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202938'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F7F4ED;
      --bg-sidebar: #F1EDE4;
      --bg-card: #FFFEFA;
      --bg-surface: #EEECE6;
      --bg-surface-hover: #E4E0D6;
      --text-primary: #202938;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --border-subtle: #E5E0D6;
      --border-focus: #202938;
      --btn-primary: #202938;
      --btn-primary-hover: #2D3748;
      --btn-primary-text: #FFFFFF;
      --accent-gold: #D6A84F;
      --accent-gold-bg: rgba(214, 168, 79, 0.12);
      --status-success-bg: #DCEFE2;
      --status-success-text: #1E663B;
      --status-warning-bg: #FEF3D6;
      --status-warning-text: #92400E;
      --status-danger-bg: #FEE2E2;
      --status-danger-text: #991B1B;
      --status-info-bg: #E0E7FF;
      --status-info-text: #3730A3;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --shadow-subtle: 0 1px 3px rgba(32, 41, 56, 0.04), 0 1px 2px rgba(32, 41, 56, 0.02);
      --shadow-dropdown: 0 10px 15px -3px rgba(32, 41, 56, 0.08), 0 4px 6px -2px rgba(32, 41, 56, 0.04);
      --shadow-modal: 0 20px 25px -5px rgba(32, 41, 56, 0.1), 0 10px 10px -5px rgba(32, 41, 56, 0.04);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background-color: var(--bg-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Common layout */
    .app-layout {
      display: flex;
      min-height: 100vh;
      background-color: var(--bg-main);
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      flex-shrink: 0;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 40;
      transition: transform 0.25s ease, width 0.25s ease;
    }

    .sidebar-brand {
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--btn-primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 2px 4px rgba(32, 41, 56, 0.15);
      flex-shrink: 0;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .nav-item:hover {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .nav-item.active {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: inset 0 0 0 1px rgba(32, 41, 56, 0.08);
    }

    .nav-item svg {
      flex-shrink: 0;
      color: var(--text-secondary);
      transition: color 0.15s ease;
    }

    .nav-item.active svg {
      color: var(--text-primary);
    }

    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: var(--radius-full);
      background-color: var(--bg-surface-hover);
      color: var(--text-secondary);
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 4px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #CBD5E1;
      color: #334155;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .user-avatar.rahul { background-color: #CCFBF1; color: #0F766E; }
    .user-avatar.akash { background-color: #DCFCE7; color: #166534; }
    .user-avatar.maya { background-color: #EDE9FE; color: #5B21B6; }

    .user-details {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role-line {
      font-size: 11.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .online-indicator {
      display: inline-block;
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .btn-signout {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      border: 0;
      background: transparent;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-signout:hover {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    /* Main Container */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
    }

    /* Top Header */
    .top-header {
      padding: 16px 36px;
      background-color: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-breadcrumb-area {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      color: var(--text-primary);
      padding: 4px;
    }

    .page-main-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Dropdown for role switcher */
    .role-switcher-container {
      position: relative;
    }

    .role-switcher-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 230px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-dropdown);
      padding: 6px;
      z-index: 50;
      display: none;
    }

    .role-switcher-dropdown.show {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .role-switch-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 0;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: background-color 0.15s ease;
    }

    .role-switch-item:hover {
      background-color: var(--bg-surface);
    }

    .role-switch-item.active {
      background-color: var(--bg-surface);
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.4;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background-color: var(--btn-primary);
      color: var(--btn-primary-text);
      border-color: var(--btn-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--btn-primary-hover);
      border-color: var(--btn-primary-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-surface);
      border-color: #D1C9BC;
    }

    .btn-accent {
      background-color: var(--accent-gold);
      color: #FFFFFF;
      border-color: var(--accent-gold);
    }

    .btn-accent:hover:not(:disabled) {
      filter: brightness(0.95);
    }

    .btn-danger {
      background-color: #DC2626;
      color: #FFFFFF;
      border-color: #DC2626;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #B91C1C;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: transparent;
      padding: 6px 10px;
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    /* Page Content */
    .page-content {
      padding: 24px 36px 48px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* Six-Stage Stepper */
    .stepper-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-subtle);
    }

    .stepper-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      cursor: pointer;
      text-decoration: none;
      min-width: 90px;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      border: 2px solid var(--border-subtle);
      background-color: var(--bg-card);
      color: var(--text-secondary);
    }

    .step-item.completed .step-circle {
      background-color: var(--btn-primary);
      border-color: var(--btn-primary);
      color: #FFFFFF;
    }

    .step-item.in-progress .step-circle {
      background-color: var(--btn-primary);
      border-color: var(--btn-primary);
      color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(32, 41, 56, 0.15);
    }

    .step-item.pending .step-circle {
      background-color: var(--bg-surface);
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }

    .step-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .step-status {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .step-item.completed .step-status {
      color: var(--text-secondary);
    }

    .step-item.in-progress .step-status {
      color: var(--text-primary);
      font-weight: 600;
    }

    .stepper-connector {
      position: absolute;
      top: 14px;
      left: 45px;
      right: 45px;
      height: 2px;
      background-color: var(--border-subtle);
      z-index: 1;
    }

    .stepper-connector-fill {
      height: 100%;
      background-color: var(--btn-primary);
      transition: width 0.3s ease;
    }

    /* Metric Summary Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-subtle);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .metric-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .metric-content {
      display: flex;
      flex-direction: column;
    }

    .metric-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .metric-label {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 3px;
    }

    /* Dashboard Main Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
    }

    .dashboard-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-subtle);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .card-body {
      padding: 20px;
    }

    /* Key-Value Details List */
    .details-table {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      font-size: 13.5px;
    }

    .detail-label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .detail-value {
      color: var(--text-primary);
    }

    .detail-value.bold {
      font-weight: 700;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .progress-bar-track {
      flex: 1;
      height: 7px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--btn-primary);
      border-radius: var(--radius-full);
      transition: width 0.3s ease;
    }

    .progress-pct {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 32px;
    }

    /* Badges & Pills */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .badge-success {
      background-color: var(--status-success-bg);
      color: var(--status-success-text);
    }
    .badge-success .badge-dot { background-color: #16A34A; }

    .badge-warning {
      background-color: var(--status-warning-bg);
      color: var(--status-warning-text);
    }
    .badge-warning .badge-dot { background-color: #D97706; }

    .badge-danger {
      background-color: var(--status-danger-bg);
      color: var(--status-danger-text);
    }
    .badge-danger .badge-dot { background-color: #DC2626; }

    .badge-info {
      background-color: var(--status-info-bg);
      color: var(--status-info-text);
    }
    .badge-info .badge-dot { background-color: #4F46E5; }

    .badge-neutral {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
    }
    .badge-neutral .badge-dot { background-color: var(--text-muted); }

    /* Category Pill Tags */
    .tag-category {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      color: var(--text-secondary);
    }

    .tag-decision { background-color: #EDE9FE; color: #5B21B6; }
    .tag-task { background-color: #FEF3D6; color: #92400E; }
    .tag-risk { background-color: #FEE2E2; color: #991B1B; }
    .tag-fact { background-color: #E0F2FE; color: #0369A1; }
    .tag-contact { background-color: #FCE7F3; color: #9D174D; }
    .tag-process { background-color: #DCFCE7; color: #166534; }
    .tag-status { background-color: #E2E8F0; color: #334155; }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 20px;
    }

    .filter-tab-btn {
      padding: 12px 2px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border: 0;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease;
    }

    .filter-tab-btn:hover {
      color: var(--text-primary);
    }

    .filter-tab-btn.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .filter-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--btn-primary);
    }

    /* List Items in Review Card */
    .review-list {
      display: flex;
      flex-direction: column;
    }

    .review-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color 0.1s ease;
    }

    .review-item:last-child {
      border-bottom: 0;
    }

    .review-item:hover {
      background-color: rgba(247, 244, 237, 0.4);
    }

    .review-item-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .review-item-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .review-item-info {
      min-width: 0;
    }

    .review-item-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .review-item-meta {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Team Members List */
    .team-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .team-member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .team-member-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-member-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .team-member-role {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Checklist */
    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checklist-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: default;
    }

    .checkbox-box {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .checkbox-box.checked {
      background-color: var(--btn-primary);
      color: #FFFFFF;
    }

    .checkbox-box.unchecked {
      border: 1.5px solid var(--border-subtle);
      background-color: var(--bg-card);
    }

    /* Alerts and Warning Cards */
    .alert-card {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background-color: var(--bg-card);
    }

    .alert-card.warning {
      background-color: #FFFDF5;
      border-color: #FDE68A;
    }

    .alert-card.warning .alert-icon {
      color: #D97706;
    }

    .alert-card.info {
      background-color: #F8FAFC;
      border-color: #CBD5E1;
    }

    /* Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .form-hint {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-primary);
      background-color: var(--bg-card);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--btn-primary);
      box-shadow: 0 0 0 3px rgba(32, 41, 56, 0.08);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      background-color: var(--bg-card);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .data-table th {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      font-weight: 600;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .data-table tr:hover td {
      background-color: rgba(247, 244, 237, 0.4);
    }

    /* Modal Dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(17, 24, 39, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      animation: fadeIn 0.15s ease;
    }

    .modal-dialog {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 540px;
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      animation: slideUp 0.15s ease;
    }

    .modal-dialog.lg {
      max-width: 720px;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-body {
      padding: 20px;
      max-height: 75vh;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast-message {
      pointer-events: auto;
      background-color: var(--btn-primary);
      color: #FFFFFF;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-modal);
      border-left: 4px solid var(--accent-gold);
      animation: slideInRight 0.2s ease;
      max-width: 400px;
    }

    /* Login & Auth Page Styling */
    .auth-page {
      min-height: 100vh;
      display: flex;
      background-color: var(--bg-main);
    }

    .auth-banner-side {
      flex: 1.1;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .auth-form-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background-color: var(--bg-main);
    }

    .auth-form-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-subtle);
    }

    .auth-tabs-header {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      border: 0;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      position: relative;
    }

    .auth-tab-btn.active {
      color: var(--text-primary);
    }

    .auth-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--btn-primary);
    }

    .role-quick-chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 14px 0 18px;
    }

    .role-chip-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background-color: var(--bg-surface);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: all 0.15s ease;
    }

    .role-chip-btn:hover {
      background-color: #E2DDD3;
      border-color: #D1C9BC;
    }

    .role-chip-btn.active {
      border-color: var(--btn-primary);
      background-color: var(--bg-card);
      box-shadow: 0 0 0 1px var(--btn-primary);
    }

    /* Print styles */
    @media print {
      body {
        background-color: #FFFFFF !important;
        color: #000000 !important;
      }
      .sidebar, .top-header, .stepper-card, .btn, .modal-overlay, .toast-container, .role-switcher-container {
        display: none !important;
      }
      .main-wrapper {
        height: auto !important;
        overflow: visible !important;
      }
      .page-content {
        padding: 0 !important;
        max-width: none !important;
      }
      .card {
        border: 1px solid #CCCCCC !important;
        box-shadow: none !important;
        break-inside: avoid;
        margin-bottom: 20px;
      }
    }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .top-header {
        padding: 14px 20px;
      }
      .page-content {
        padding: 20px;
      }
    }

    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: block;
      }
      .auth-page {
        flex-direction: column;
      }
      .auth-banner-side {
        padding: 24px;
        flex: none;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      .stepper-track {
        overflow-x: auto;
        padding-bottom: 8px;
        justify-content: flex-start;
        gap: 24px;
      }
      .stepper-connector {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div style="min-height: 100vh; display: grid; place-items: center; color: #6B7280; font-family: sans-serif;">
      <div style="display: flex; align-items: center; gap: 10px;">

  <div id="modal-container"></div>
  <div id="toast-container" class="toast-container"></div>

  <style>

  <script>
    // --- Application State ---
    let T = null; // Session Token
    let S = null; // State Snapshot
    let currentTab = 'overview';
    let authMode = 'login'; // 'login' | 'register'
    let isBusy = false;
    let syncIntervalId = null;
    let activeOverviewFilter = 'all';
    let activeRecordsCategory = 'all';
    let searchQuery = '';
    let isMobileSidebarOpen = false;
    let isRoleMenuOpen = false;

    try {
      T = localStorage.getItem('tm5t');
    } catch (e) {}

    const $ = id => document.getElementById(id);

    // --- Lucide-style Inline SVG Icons ---
    function icon(name, size = 18, strokeWidth = 2, className = '') {
      const icons = {

        projects: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>',
        sources: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>',

        settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',

        edit: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
        calendar: '<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>',
        checkSquare: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
        square: '<rect width="18" height="18" x="3" y="3" rx="2"/>',
        logOut: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        plus: '<line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
        printer: '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
        alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',

        eyeOff: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>',
        arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',

        fileText: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>',
        chevronDown: '<polyline points="6 9 12 15 18 9"/>',
        menu: '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
        sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>'

      const svgInner = icons[name] || icons.fileText;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="${className}">${svgInner}</svg>`;
    }

    // --- Helpers ---
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function timeAgo(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      return days + (days === 1 ? ' day ago' : ' days ago');
    }

    function formatDate(dateString) {
      if (!dateString) return '—';
      try {
        const d = new Date(dateString);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return dateString;
      }
    }

    function toast(message, type = 'info') {
      const container = $('toast-container');
      const el = document.createElement('div');
      el.className = 'toast-message';
      el.innerHTML = `${icon(type === 'error' ? 'alert' : 'check', 16, 2)} <span>${esc(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 250);
      }, 3500);
    }

    function closeModal() {
      $('modal-container').innerHTML = '';
    }

    function openModal(contentHtml) {
      $('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          ${contentHtml}
        </div>
      `;
    }

    // --- API Communication ---
    async function api(action, payload = {}) {
      isBusy = true;
      try {
        const res = await fetch('/api/app', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (T || '')
          },
          body: JSON.stringify(Object.assign({ action }, payload))
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 401 && T && action !== 'login') {
            dropSession();
            render();
          }
          toast(data.error || `Request failed (${res.status})`, 'error');
          return null;
        }
        if (data.token) {
          T = data.token;
          try { localStorage.setItem('tm5t', T); } catch (e) {}
        }
        if (data.state) {
          S = data.state;
        }
        if (data.msg) {
          toast(data.msg, 'success');
        }
        return data;
      } catch (err) {
        toast('Connection error. Please check server.', 'error');
        return null;
      } finally {
        isBusy = false;
      }
    }

    async function sync() {
      if (!T || isBusy) return;
      try {
        const res = await fetch('/api/app', {
          headers: { Authorization: 'Bearer ' + T },
          cache: 'no-store'
        });
        if (res.status === 401) {
          dropSession();
          render();
          return;
        }
        const data = await res.json();
        if (data.state && (!S || data.state.rev !== S.rev || data.state.user.id !== S.user.id)) {
          S = data.state;
          render();
        }
      } catch (e) {}
    }

    function dropSession() {
      T = null;
      S = null;
      try { localStorage.removeItem('tm5t'); } catch (e) {}
    }

    // --- Sample Ingestion Documents ---
    const SAMPLE_DOCS = {
      notes: {
        name: 'meeting-notes-sprint14.txt',
        content: [
          'STATUS: Sprint 14 is 70 percent done and staging is stable.',
          'DECISION: Payment reconciliation policy: Daily reconciliation runs at 2 AM UTC.',

    // --- State Computations ---
    function getApprovedRecords() {
      return (S && S.records) ? S.records.filter(r => r.st === 'approved') : [];
    }

    function getPendingConflicts() {
      if (!S || !S.records) return [];
      const map = {};
      S.records.forEach(r => {
        if (r.cf && r.st === 'pending') {
          (map[r.cf] = map[r.cf] || []).push(r);
        }
      });
      return Object.values(map);
    }

    function getVerificationRate() {
      if (!S || !S.records || S.records.length === 0) return 0;
      const approved = getApprovedRecords().length;
      return Math.round((approved / S.records.length) * 100);
    }

    function getHandoverStages() {
      const p = S && S.project;
      const records = (S && S.records) || [];
      const sources = (S && S.sources) || [];
      const ho = (S && S.ho) || {};
      const approved = getApprovedRecords();
      const openConflicts = getPendingConflicts();

      const stage1Done = !!p;
      const stage2Done = sources.length > 0 && sources.every(s => s.done);
      const stage3Done = records.length > 0 && approved.length > 0 && openConflicts.length === 0;
      const stage4Done = !!ho.gen;
      const stage5Done = !!ho.ok;
      const stage6Done = !!ho.acc;

      const dones = [stage1Done, stage2Done, stage3Done, stage4Done, stage5Done, stage6Done];
      const currentIdx = dones.indexOf(false);

      const stages = [
        { id: 1, name: 'Project', statusText: stage1Done ? 'Completed' : (currentIdx === 0 ? 'In Progress' : 'Pending'), done: stage1Done, active: currentIdx === 0, tab: 'projects' },
        { id: 2, name: 'Sources', statusText: stage2Done ? 'Completed' : (currentIdx === 1 ? 'In Progress' : 'Pending'), done: stage2Done, active: currentIdx === 1, tab: 'sources' },
        { id: 3, name: 'Review', statusText: stage3Done ? 'Completed' : (currentIdx === 2 ? 'In Progress' : 'Pending'), done: stage3Done, active: currentIdx === 2, tab: 'records' },
        { id: 4, name: 'Report', statusText: stage4Done ? 'Completed' : (currentIdx === 3 ? 'In Progress' : 'Pending'), done: stage4Done, active: currentIdx === 3, tab: 'handovers' },
        { id: 5, name: 'Approval', statusText: stage5Done ? 'Completed' : (currentIdx === 4 ? 'In Progress' : 'Pending'), done: stage5Done, active: currentIdx === 4, tab: 'approval' },
        { id: 6, name: 'Accepted', statusText: stage6Done ? 'Completed' : (currentIdx === 5 ? 'In Progress' : 'Pending'), done: stage6Done, active: currentIdx === 5, tab: 'handovers' }
      ];

      return { stages, currentIdx: currentIdx === -1 ? 5 : currentIdx };
    }

    // --- View: Knowledge Records Page ---

      // Filter by search and category
      let filtered = records;
      if (activeRecordsCategory !== 'all') {
        filtered = filtered.filter(r => r.type === activeRecordsCategory);
      }
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(r => r.text.toLowerCase().includes(q) || (r.src && r.src.toLowerCase().includes(q)));
      }

      const categories = [
        { id: 'all', label: 'All Records', count: records.length },
        { id: 'decision', label: 'Decisions', count: records.filter(r => r.type === 'decision').length },
        { id: 'fact', label: 'Technical Facts', count: records.filter(r => r.type === 'fact').length },
        { id: 'task', label: 'Tasks', count: records.filter(r => r.type === 'task').length },
        { id: 'risk', label: 'Risks', count: records.filter(r => r.type === 'risk').length },
        { id: 'contact', label: 'Contacts', count: records.filter(r => r.type === 'contact').length },

      return `
        <div style="display: flex; flex-direction: column; gap: 24px;">

                    ${group.map(item => `
                      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid #F3F4F6;">

            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">

            <div style="display: flex; align-items: center; gap: 12px;">
              <input class="form-input" style="width: 220px;" placeholder="Search records..." value="${esc(searchQuery)}" oninput="searchQuery = this.value; render();" />

                        <span class="badge badge-success">
                          <span class="badge-dot"></span>
                          <span>Approved</span>
                        </span>
                      ` : r.st === 'rejected' ? `
                        <span class="badge badge-danger">
                          <span class="badge-dot"></span>
                          <span>Rejected</span>
                        </span>
                      ` : r.cf ? `
                        <span class="badge badge-warning">
                          <span class="badge-dot"></span>
                          <span>Conflict</span>
                        </span>

                      <button class="btn btn-secondary btn-sm" onclick="api('decide', { id: ${r.id}, ok: true }).then(render)">

                <p>No knowledge records found matching the current criteria.</p>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // --- Main Render Dispatcher ---
    function render() {
      const root = $('app-root');

      // If no authenticated state, render authentication screen
      if (!S) {
        root.innerHTML = renderAuthView();
        return;
      }

      // Render authenticated application layout
      let pageViewHtml = '';
      if (currentTab === 'overview') pageViewHtml = renderOverviewView();
      else if (currentTab === 'projects') pageViewHtml = renderProjectsView();
      else if (currentTab === 'sources') pageViewHtml = renderSourcesView();
      else if (currentTab === 'records') pageViewHtml = renderRecordsView();
      else if (currentTab === 'handovers') pageViewHtml = renderHandoversView();
      else if (currentTab === 'audit') pageViewHtml = renderAuditView();
      else if (currentTab === 'settings') pageViewHtml = renderSettingsView();
      else if (currentTab === 'approval') pageViewHtml = renderHandoversView();

      root.innerHTML = `
        <div class="app-layout">
          ${renderSidebar()}
          <div class="main-wrapper">
            ${renderHeader()}
            <main class="page-content">
              ${renderStepper()}
              ${renderMetrics()}
              ${pageViewHtml}
            </main>
          </div>
        </div>
      `;
    }

    // --- User Actions & Interactions ---
    function switchTab(tabId) {
      currentTab = tabId;
      isMobileSidebarOpen = false;
      isRoleMenuOpen = false;
      render();
    }

    function toggleMobileSidebar() {
      isMobileSidebarOpen = !isMobileSidebarOpen;
      const sb = $('app-sidebar');
      if (sb) sb.className = isMobileSidebarOpen ? 'sidebar open' : 'sidebar';
    }

    function toggleRoleMenu(e) {
      if (e) e.stopPropagation();
      isRoleMenuOpen = !isRoleMenuOpen;
      const rm = $('role-menu');
      if (rm) {
        rm.className = isRoleMenuOpen ? 'role-switcher-dropdown show' : 'role-switcher-dropdown';
      }
    }

    document.addEventListener('click', (e) => {
      if (isRoleMenuOpen && !e.target.closest('.role-switcher-container')) {
        isRoleMenuOpen = false;
        const rm = $('role-menu');
        if (rm) rm.className = 'role-switcher-dropdown';
      }
    });

    function continueHandover() {
      const { stages } = getHandoverStages();
      const current = stages.find(s => s.active) || stages[0];
      switchTab(current.tab);
    }

    function setOverviewCategory(cat) {
      activeOverviewFilter = cat;
      render();
    }

    function setRecordsCategory(cat) {
      activeRecordsCategory = cat;
      render();
    }

    function selectLoginAccount(acc) {
      $('auth-username').value = acc;
      ['rahul', 'maya', 'akash'].forEach(id => {
        const chip = $('chip-' + id);
        if (chip) chip.className = id === acc ? 'role-chip-btn active' : 'role-chip-btn';
      });
    }

    function togglePasswordVisibility() {
      const input = $('auth-password');
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      $('pwd-icon').innerHTML = icon(isPwd ? 'eyeOff' : 'eye', 16, 2);
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const user = $('auth-username').value.trim();
      const password = $('auth-password').value;
      const btn = $('login-submit-btn');
      btn.disabled = true;
      btn.innerText = 'Signing in...';

      const res = await api('login', { user, password });
      if (res) {
        currentTab = 'overview';
        render();
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span> ${icon('arrowRight', 15, 2)}`;
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const targetRole = $('reg-role').value;
      toast('Account provisioned! Accessing workspace...');
      const res = await api('login', { user: targetRole, password: 'demo123' });
      if (res) {
        currentTab = 'overview';
        render();
      }
    }

      isRoleMenuOpen = false;

          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitProjectModal(${isEdit})">
              ${isEdit ? 'Save Changes' : 'Create Project'}
            </button>
          </div>
        </div>
      `);
    }

    async function submitProjectModal(isEdit) {
      const name = $('modal-proj-name').value.trim();
      const desc = $('modal-proj-desc').value.trim();
      const timeline = $('modal-proj-timeline').value.trim();

      if (!name) {
        toast('Please enter a project name', 'error');
        return;
      }

      closeModal();
      const action = isEdit ? 'updateProject' : 'create';
      const res = await api(action, { name, desc, status: timeline, timeline });
      if (res) {
        if (!isEdit) currentTab = 'sources';
        render();
      }
    }

    // --- Source Ingestion Actions ---
    function openAddSourceModal() {
      openPasteSourceModal();
    }

    function openPasteSourceModal() {
      openModal(`
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title">Paste Knowledge Document</h3>
            <button class="btn-ghost" onclick="closeModal()">${icon('x', 18, 2)}</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label">Document Title / File Name</label>
              <input class="form-input" id="paste-source-name" value="architecture-notes.txt" placeholder="e.g. sprint-notes.txt" />
            </div>

            <div class="form-group">
              <label class="form-label">Text Content</label>
              <textarea class="form-textarea" id="paste-source-text" rows="6" placeholder="Paste notes line by line. Prefixes like DECISION:, TODO:, RISK: enhance classification."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitPasteSource()">Add Document</button>
          </div>
        </div>
      `);
    }

    async function submitPasteSource() {
      const name = $('paste-source-name').value.trim();
      const text = $('paste-source-text').value;
      if (!text.trim()) {
        toast('Document content cannot be empty', 'error');
        return;
      }
      closeModal();
      await api('addSource', { name, text });
      render();
    }

    async function addSample(key) {
      const doc = SAMPLE_DOCS[key];
      if (S.sources && S.sources.some(s => s.name === doc.name)) {
        toast('Sample document already added');
        return;
      }
      await api('addSource', { name: doc.name, text: doc.content });
      render();
    }

    async function handleFileUpload(e) {
      const files = e.target.files;
      if (!files || !files.length) return;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const text = await file.text();
        await api('addSource', { name: file.name, text });
      }
      render();
    }

    function previewSource(id) {
      const src = (S.sources || []).find(s => s.id === id);
      if (!src) return;

      openModal(`
        <div class="modal-dialog lg">
          <div class="modal-header">
            <h3 class="modal-title">${esc(src.name)}</h3>
            <button class="btn-ghost" onclick="closeModal()">${icon('x', 18, 2)}</button>
          </div>
          <div class="modal-body">
            <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">
              ${src.chars.toLocaleString()} characters &bull; ${src.done ? 'Extracted' : 'Pending Extraction'}
            </div>
            <pre style="background-color: var(--bg-surface); padding: 14px; border-radius: var(--radius-sm); font-size: 12.5px; white-space: pre-wrap; font-family: monospace; max-height: 55vh; overflow-y: auto;">${esc(src.preview || 'No preview text available.')}</pre>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Close</button>
          </div>
        </div>
      `);
    }

    async function deleteSource(id) {
      if (!confirm('Remove this source document?')) return;
      await api('deleteSource', { id });
      render();
    }

    // --- Conflict Resolution ---
    function resolveConflictPrompt(keepId, groupId) {
      const rec = (S.records || []).find(r => r.id === keepId);
      if (!rec) return;

      openModal(`
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title">Resolve Evidence Conflict</h3>
            <button class="btn-ghost" onclick="closeModal()">${icon('x', 18, 2)}</button>
          </div>
          <div class="modal-body">
            <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 12px;">
              You have chosen to retain this statement as verified truth:
            </p>
            <div style="background-color: var(--bg-surface); padding: 12px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; margin-bottom: 16px;">
              ${esc(rec.text)}
            </div>
            <div class="form-group">
              <label class="form-label">Reason for this choice *</label>
              <input class="form-input" id="conflict-resolve-reason" placeholder="e.g. Confirmed via latest production logs and QA sign-off" />
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitConflictResolution(${keepId})">Confirm Resolution</button>
          </div>
        </div>
      `);
    }

    async function submitConflictResolution(keepId) {
      const reason = $('conflict-resolve-reason').value.trim();
      if (reason.length < 3) {
        toast('Please enter a clear explanation for this resolution', 'error');
        return;
      }
      closeModal();
      await api('resolve', { id: keepId, reason });
      render();
    }

    // --- Modals: Share & Info ---
    function openShareModal() {
      const url = window.location.origin;
      openModal(`
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title">Share Knowledge Handover</h3>
            <button class="btn-ghost" onclick="closeModal()">${icon('x', 18, 2)}</button>
          </div>
          <div class="modal-body">
            <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 16px;">
              Collaborate with team members. Anyone with access to this platform can review and audit handover progress.
            </p>
            <div class="form-group">
              <label class="form-label">Platform URL</label>
              <div style="display: flex; gap: 8px;">
                <input class="form-input" value="${esc(url)}" readonly id="share-url-input" />
                <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${url}'); toast('URL copied to clipboard!')">
                  Copy
                </button>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="closeModal()">Done</button>
          </div>
        </div>
      `);
    }

    function showForgotPasswordInfo() {
      openModal(`
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title">Demo Credentials</h3>
            <button class="btn-ghost" onclick="closeModal()">${icon('x', 18, 2)}</button>
          </div>
          <div class="modal-body">
            <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 14px;">
              TURBOMINDS is operating in Hackathon Demonstration Mode. The standard accounts and credentials are:
            </p>
            <ul style="padding-left: 20px; font-size: 13px; line-height: 1.8; color: var(--text-primary);">
              <li><b>Rahul Sharma:</b> <code>rahul</code> &bull; Password: <code>demo123</code> (Departing Owner)</li>
              <li><b>Maya Desai:</b> <code>maya</code> &bull; Password: <code>demo123</code> (Approver)</li>
              <li><b>Akash Patil:</b> <code>akash</code> &bull; Password: <code>demo123</code> (Successor)</li>
            </ul>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="closeModal()">Got it</button>
          </div>
        </div>
      `);
    }

    function exportAuditLog() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S.audit || [], null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "turbominds-audit-trail.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // --- Initialization & Background Sync ---
    window.addEventListener('DOMContentLoaded', async () => {
      if (T) {
        await sync();
      }
      render();

      // Background periodic sync
      syncIntervalId = setInterval(() => {
        const active = document.activeElement;
        if (active && ['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName)) return;
        sync();
      }, 4000);
    });
  </script>
</body>
</html>
