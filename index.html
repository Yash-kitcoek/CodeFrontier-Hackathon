play:block}main{max-width:none;padding:0}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}</style></head><body><div id='r'><div class=ld>Loading…</div></div><div id='t' class='toast'></div><script>var T=null,S=null,tab='project',busy=false,tt,NL=String.fromCharCode(10);try{T=localStorage.getItem('tm5t')}catch(e){}var $=function(i){return document.getElementById(i)};function toast(m){var e=$('t');e.textContent=m;e.className='toast show';clearTimeout(tt);tt=setTimeout(function(){e.className='toast'},3600)}var esc=function(s){return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;')};var fmt=function(t){try{return new Date(t).toLocaleString()}catch(e){return t}};function drop(){T=null;S=null;try{localStorage.removeItem('tm5t')}catch(e){}}async function api(a,d){busy=true;try{var r=await fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(T||'')},body:JSON.stringify(Object.assign({action:a},d||{}))});var j={};try{j=await r.json()}catch(e){}if(!r.ok){if(r.status===401&&T&&a!=='login'){drop()}toast(j.error||'Request failed ('+r.status+')');return null}if(j.token){T=j.token;try{localStorage.setItem('tm5t',T)}catch(e){}}if(j.state)S=j.state;if(j.msg)toast(j.msg);return j}catch(e){toast('Network error. Check your connection.');return null}finally{busy=false}}async function sync(){if(!T||busy)return;try{var r=await fetch('/api/app',{headers:{Authorization:'Bearer '+T},cache:'no-store'});if(r.status===401){drop();R();return}var j=await r.json();if(j.state&&(!S||j.state.rev!==S.rev||j.state.user.id!==S.user.id)){S=j.state;R()}}catch(e){}}var SAMPLE={notes:{name:'meeting-notes.txt',lines:['STATUS: Sprint 14 is 70 percent done and staging is stable.','DECISION: Use Razorpay as the payment gateway.','DECISION: Freeze the API contract v2 until launch.','TODO: Finish the refund webhook retry logic.','TODO: Rotate the staging database credentials.','RISK: The SMS vendor contract expires on pproved</span><div class=bar><i style='width:${t?a/t*100:0}%'></i></div></div><div class=card><b>Status:</b> ${esc(p.status)}</div>`}function vSources(){var s=S.sources,pend=s.filter(function(x){return !x.done}).length,lk=S.ho.gen;if(!S.project)return `<h1>Sources</h1><div class=card>Create the project first.</div>`;return `<h1>Sources</h1><p class=mu>Upload meeting notes and project documents. Every record keeps its source line as evidence.${lk?' The report is generated, so sources are locked.':''}</p><div class=card><b>Add a source</b><br><input type=file id=fi accept='.txt,.md,.csv,.json,.log' multiple ${lk?'disabled':''}><label>Or paste text</label><input id=tn placeholder='Name, e.g. kickoff-notes.txt'><textarea id=tx rows=4 placeholder='One item per line. Prefixes like TODO:, DECISION:, RISK: help.'></textarea><button class=btn data-a=paste>Add pasted text</button><button class='btn sec' data-a=sample data-v=notes>Add sample meeting notes</button><button class='btn sec' data-a=sample data-v=docs>Add sample documentation</button></div><div class=card><b>${s.length} source(s)</b>${s.map(function(x){return `<div class=rec>${esc(x.name)} <span class=badge>${x.done?'extracted':'not extracted'}</span>${x.skipped?`<span class=mu>${x.skipped} suspicious instruction line(s) skipped</span>`:''}</div>`}).join('')}<button class=btn data-a=extract ${pend&&!lk?'':'disabled'}>Run extraction on all</button></div>`}function vRecords(){var rs=S.records,can=S.user.id==='rahul'&&!S.ho.gen,cf={};rs.forEach(function(r){if(r.cf&&r.st==='pending')(cf[r.cf]=cf[r.cf]||[]).push(r)});var conf=Object.keys(cf).map(function(k){var g=cf[k];return `<div class='card warn'><b>Conflict: sources disagree</b>${g.map(function(r){return `<div class=rec>${esc(r.text)}<div class=mu>${esc(r.src)}</div>${can?`<button class='btn sec' data-a=keep data-id=${r.id} data-g=${g[0].id}>Keep this one</button>`:''}</div>`}).join('')}${can?`<input id=why${g[0].id} placeholder='Reason for your choice (required)'>`:''}</div>`}).join('');return `<h1>Records</h1><p class=mu>${rs.length} extracted · ${ap().length} approved${S.ho.gen?' · locked after report generation':''}</p>${can&&rs.length?`<button class=btn data-a=approveall>Approve all verified</button><span class=mu>Approves pending records whose source line is found in the source and that have no open conflict.</span>`:''}${conf}${rs.length?rs.map(function(r){return `<div class=card><span class='badge ${r.type}'>${r.type}</span><span class='badge ${r.st}'>${r.st}</span>${r.cf?`<span class=badge>conflict</span>`:''}<div>${esc(r.text)}</div><div class=mu>Source: ${esc(r.src)} — “${esc(r.ev)}”</div>${r.note?`<div class=mu>${esc(r.note)}</div>`:''}${can&&r.st==='pending'&&!r.cf?`<button class=btn data-a=ok data-id=${r.id}>Approve</button><button class='btn sec' data-a=no data-id=${r.id}>Reject</button>`:''}</div>`}).join(''):`<div class=card>No records yet. Add sources and run extraction.</div>`}`}function tk(r){var x=rec(r.id)||r;return S.ho.acc&&S.user.id==='akash'?`<div><select data-a=ts data-id=${r.id}>${['Open','In progress','Blocked','Done'].map(function(o){return `<option ${o===x.ts?'selected':''}>${o}</option>`}).join('')}</select></div>`:`<div><span class=badge>${x.ts}</span></div>`}function sec(t,k){var l=base().filter(function(r){return k.indexOf(r.type)>-1});return `<div class=card><b>${t} (${l.length})</b>${l.map(function(r){return `<div class=rec>${esc(r.text)}${r.type==='task'?tk(r):''}<div class=mu>Source: ${esc(r.src)}</div></div>`}).join('')||'<div class=mu>None</div>'}</div>`}function vHandover(){var h=S.ho,u=S.user.id,p=S.project,head='<h1>Handover report</h1>';if(!p)return head+'<div class=card>No project yet.</div>';if(!h.gen)return head+`<div class=card>${u==='rahul'?`<p>${ap().length} approved record(s) ready.</p><button class=btn data-a=gen>Generate handover report</button>`:'Rahul has not generated the report yet.'}</div>`;if(!h.ok&&u==='akash')return head+'<div class=card>Waiting for Maya (Manager) to n R(){var el=$('r');if(!S){el.innerHTML=`<div class=login><div class=card><div class=logo>T</div><h1>TURBOMINDS</h1><p class=mu>Evidence-backed knowledge handover. Sign in with a demo account.</p><label>Account</label><select id=lu><option value=rahul>Rahul · Departing owner</option><option value=maya>Maya · Manager</option><option value=akash>Akash · Successor</option></select><label>Password</label><input id=lp type=password placeholder='Password'><p class=mu>Demo password for all accounts: demo123</p><button class='btn w' data-a=in>Sign in</button><button class='btn sec w' data-a=reset>Reset demo data</button></div></div>`;return}var u=S.user.id;var tabs=[['project','Project'],['sources','Sources'],['records','Records'],['handover','Handover'],['audit','Audit log']].filter(function(t){return !(u==='akash'&&(t[0]==='sources'||t[0]==='records'))&&!(u==='maya'&&t[0]==='sources')});if(!tabs.some(function(t){return t[0]===tab}))tab=tabs[0][0];var v={project:vProject,sources:vSources,records:vRecords,handover:vHandover,audit:vAudit}[tab]();el.innerHTML=`<div class=app><aside><div class=brand><div class=logo>T</div>TURBOMINDS</div>${tabs.map(function(t){return `<button data-a=tab data-v=${t[0]} class='${tab===t[0]?'on':''}'>${t[1]}</button>`}).join('')}<div class=sp></div><div class=me><b>${esc(S.user.n)}</b><br>${esc(S.user.role)}<br><span class=dot></span>Live · shared database</div><button data-a=out>Sign out</button></aside><main>${topbar()}${steps()}${v}</main></div>`}async function act(a,d){if(a==='in'){var j=await api('login',{user:$('lu').value,password:$('lp').value});if(j)tab=S.user.id==='rahul'?'project':'handover'}else if(a==='out'){await api('logout');drop()}else if(a==='reset'){if(!confirm('Reset all demo data for everyone?'))return;await api('reset');drop();toast('Demo data reset')}else if(a==='tab'){tab=d.v}else if(a==='create'){var c=await api('create',{name:$('pn').value,desc:$('pd').value,status:$('ps').value});if(c)tab='sources'}else if(a==='sample'){var x=SAMPLE[d.v];if(S.sources.some(function(s){return s.name===x.name})){toast('Already added');return}await api('addSource',{name:x.name,text:x.lines.join(NL)})}else if(a==='paste'){await api('addSource',{name:$('tn').value,text:$('tx').value})}else if(a==='extract'){var e=await api('extract');if(e)tab='records'}else if(a==='ok'||a==='no'){await api('decide',{id:Number(d.id),ok:a==='ok'})}else if(a==='approveall'){await api('approveAll')}else if(a==='keep'){var w=$('why'+d.g);await api('resolve',{id:Number(d.id),reason:w?w.value:''})}else if(a==='print'){window.print();return}else if(a==='gen'){await api('generate')}else if(a==='mgr'){await api('mgrApprove')}else if(a==='accept'){await api('accept')}R()}document.addEventListener('click',function(e){var t=e.target;if(t.tagName==='SELECT'||t.tagName==='INPUT'||t.tagName==='OPTION')return;var b=t.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='lp')act('in',{})});document.addEventListener('change',async function(e){var t=e.target;if(t.id==='fi'){for(var i=0;i<t.files.length;i++){var f=t.files[i];var txt=await f.text();await api('addSource',{name:f.name,text:txt})}R()}else if(t.dataset&&t.dataset.a==='ts'){await api('setTask',{id:Number(t.dataset.id),status:t.value});R()}});setInterval(function(){var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return;sync()},5000);if(T){sync().then(function(){if(!S)R()})}else{R()}</script></body></html>
